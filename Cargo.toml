[package]
name = "tubetui"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "YouTube in your terminal: tabs, embedded mpv video, multi-account profiles and a TOML config editable from the app"
license = "MIT OR Apache-2.0"
repository = "https://github.com/polblancoo/tubetui"
readme = "README.md"
keywords = ["youtube", "tui", "ratatui", "mpv", "terminal"]
categories = ["command-line-utilities", "multimedia::video"]
exclude = ["/.github", "/ConfigSeed.toml"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1.0.1"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
ureq = "3.4.2"
