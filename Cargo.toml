[package]
name = "tubetui"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "YouTube and your local videos and music in the terminal: tabs, video embedded in kitty via mpv, subscriptions, watch later, browser login and a settings screen"
license = "MIT OR Apache-2.0"
repository = "https://github.com/polblancoo/tubetui"
readme = "README.md"
keywords = ["youtube", "tui", "ratatui", "mpv", "terminal"]
categories = ["command-line-utilities", "multimedia::video"]
exclude = ["/.github", "/ConfigSeed.toml", "/docs"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1.0.1"
tachyonfx = "0.25"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
ureq = "3.4.2"
